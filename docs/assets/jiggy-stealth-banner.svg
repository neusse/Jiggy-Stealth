<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Jiggy-Stealth</title>
  <desc id="description">A USB mouse bridge for RP2040. Real input first, optional movement and Shift, off at boot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09151e"/>
      <stop offset="1" stop-color="#102d36"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#36cbb8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#36cbb8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7db5be" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1c404b"/>
      <stop offset="1" stop-color="#102732"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#background)"/>
  <rect x="740" width="540" height="360" rx="20" fill="url(#grid)"/>
  <ellipse cx="1035" cy="170" rx="330" ry="245" fill="url(#glow)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
