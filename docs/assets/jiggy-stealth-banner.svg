    <text x="66" y="154" fill="#f2f7f8" font-size="68" font-weight="700" letter-spacing="-2.6">Jiggy-Stealth</text>
    <text x="70" y="202" fill="#b7d1d8" font-size="22">Your mouse. A little extra motion.</text>
    <rect x="70" y="238" width="147" height="32" rx="16" fill="#17393f" stroke="#3a7778"/>
    <circle cx="88" cy="254" r="4" fill="#36cbb8"/>
    <text x="101" y="259" fill="#bfeee4" font-size="12" font-weight="600" letter-spacing="1">OFF AT BOOT</text>
    <rect x="229" y="238" width="224" height="32" rx="16" fill="#142d3a" stroke="#315363"/>
    <text x="247" y="259" fill="#b2d0e0" font-size="12" font-weight="600" letter-spacing=".8">USB IDENTITY FORWARDING</text>
